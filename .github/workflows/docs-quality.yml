name: docs-quality

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs-quality.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs-quality.yml'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run docs checks
        run: python scripts/check_docs.py
