version: "3.9"
# ============================================================
# InsolePro — Docker Compose stack (web + db)
#
# EXPO STARTUP — run this single command on the host Mac:
#   ./expo-start.sh
#
# That script runs `docker compose up -d --build` then launches
# the STEPPA BLE bridge on the host (Bluetooth cannot pass through
# Docker Desktop on macOS — the bridge must run on the host).
#
# BLE bridge config lives in .env:
#   BLE_USERNAME   / BLE_PASSWORD   — Django login (default: admin)
#   BLE_PATIENT_ID / BLE_DEVICE_ID  — records to attach sessions to (default: 1)
#   BLE_DEVICE_NAME                 — BLE advertised name (default: STEPPA)
#   BLE_BASE_URL                    — API base (default: http://127.0.0.1:8000)
# ============================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    env_file:
      - .env
    working_dir: /app/wbs
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/scripts/start-dev.sh"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-balance}
      POSTGRES_USER: ${POSTGRES_USER:-balance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-balance}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-balance} -d ${POSTGRES_DB:-balance}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
